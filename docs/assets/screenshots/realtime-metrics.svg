  <rect x="100" y="200" width="840" height="400" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="520" y="240" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Latency (ms) - Live Streaming</text>
  <line x1="150" y1="550" x2="890" y2="400" stroke="#22c55e" stroke-width="2" fill="none"/>
  <line x1="150" y1="550" x2="890" y2="450" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="520" y="580" font-family="system-ui, sans-serif" font-size="14" fill="#22c55e" text-anchor="middle">p50: 142ms  |  p95: 480ms  |  p99: 1.2s</text>
  <rect x="1000" y="200" width="840" height="400" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1420" y="240" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Error Rate (%) - Live Streaming</text>
  <line x1="1050" y1="550" x2="1790" y2="300" stroke="#ef4444" stroke-width="2" fill="none"/>
  <text x="1420" y="580" font-family="system-ui, sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">Current: 3.8%  |  Threshold: 1%</text>
  <rect x="100" y="650" width="840" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="520" y="690" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">CPU & Memory Usage</text>
  <rect x="1000" y="650" width="840" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1420" y="690" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Request Rate & Throughput</text>
  <text x="960" y="980" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">WebSocket: Connected | Auto-reconnect: Enabled | Update Interval: 1s | Filters: metric, from, to</text>
