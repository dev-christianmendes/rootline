<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" fill="#64748b">🗺️ Service Map & Dependencies</text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#475569">Screenshot placeholder - replace with actual screenshot</text>
  <circle cx="960" cy="300" r="60" fill="#059669" stroke="#10b981" stroke-width="3"/>
  <text x="960" y="305" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">frontend-web<br/>🟢 Healthy</text>
  <circle cx="960" cy="500" r="60" fill="#059669" stroke="#10b981" stroke-width="3"/>
  <text x="960" y="505" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">api-gateway<br/>🟢 Healthy</text>
  <circle cx="500" cy="500" r="60" fill="#ef4444" stroke="#f87171" stroke-width="3"/>
  <text x="500" y="505" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">payment-api<br/>🔴 Critical</text>
  <circle cx="1420" cy="500" r="60" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
  <text x="1420" y="505" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">checkout-api<br/>🟡 Degraded</text>
  <circle cx="500" cy="700" r="60" fill="#059669" stroke="#10b981" stroke-width="3"/>
  <text x="500" y="705" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">auth-api<br/>🟡 Degraded</text>
  <circle cx="1420" cy="700" r="60" fill="#059669" stroke="#10b981" stroke-width="3"/>
  <text x="1420" y="705" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">catalog-api<br/>🟢 Healthy</text>
  <line x1="960" y1="360" x2="960" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="560" x2="560" y2="500" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="960" y1="560" x2="1360" y2="500" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="560" x2="560" y2="640" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1360" y1="560" x2="1420" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <text x="960" y="900" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Interactive: Click node for Service Detail | Color = Health | Edge weight = Dependency strength</text>
</svg>
