name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  api:
    name: API tests · SQLite + PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootline
          POSTGRES_PASSWORD: rootline
          POSTGRES_DB: rootline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootline -d rootline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest

      - name: Tests on SQLite
        run: python -m pytest apps/api -q

      # SQLite ignores constraints PostgreSQL enforces, so the same suite runs
      # against a real database to catch insert ordering and dialect issues.
      - name: Tests on PostgreSQL
        env:
          ROOTLINE_TEST_DATABASE_URL: postgresql+psycopg://rootline:rootline@localhost:5432/rootline_test
        run: python -m pytest apps/api -q

  mock-data:
    name: Mock data determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert mock data matches the generator
        run: npm run test:mock
